#
# The drift guard (spec 003 FR-011; data-model §6; contracts/deductive-conventions.md).
# One [[mirror]] per library function that a restated copy in src/ mirrors:
#
#   restated    = "module::fn" in src/
#   library     = "core/src/s2/<file>.rs::<fn>" or "<file>.rs::<impl header>::<fn>"
#   fingerprint = "fnv1a64:<16 hex digits>" of the library function's tokens, doc attributes removed,
#                 followed by those of the module constants it names (top-level `const` items of
#                 the same file, such as MAX_DECODE_COUNT)
#   differences = the permitted differences the restatement uses (deductive-conventions rule 2)
#
# `tests/drift.rs` recomputes every fingerprint. After reviewing a restated copy against a
# changed library function, run `make verify-deductive-bless`.

